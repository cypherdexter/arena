name: Scout
on:
  schedule:
    - cron: "15 */6 * * *"
    - cron: "45 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Modalità
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "45 * * * *" ]; then echo "mode=regime" >> $GITHUB_OUTPUT; else echo "mode=full" >> $GITHUB_OUTPUT; fi
      - name: Esegui Scout
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/scout.html
        run: node scout-run.js ${{ steps.mode.outputs.mode }}
      - name: Salva risultati
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add scout-data.json
          git diff --cached --quiet || git commit -m "scout: aggiornamento $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
